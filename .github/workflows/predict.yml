name: Predict

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours UTC
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache static data
        uses: actions/cache@v4
        with:
          path: data/static
          key: static-data-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build grid if needed
        run: |
          if [ ! -f data/static/grid.geojson ]; then
            python -m src.grid.build_grid
          fi

      - name: Run prediction pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.pipeline

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outputs/ docs/data/
          git diff --cached --quiet || git commit -m "Prediction run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
