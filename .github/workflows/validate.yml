name: Validate

on:
  schedule:
    - cron: '0 2 * * 0'      # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation scaffold
        run: python -m src.validation.framework

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/validation/ docs/data/
          git diff --cached --quiet || git commit -m "Validation run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
